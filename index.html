
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux Demo Center</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #153c2c, #080d0b 65%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: #101b16;
    border: 1px solid #28533c;
    border-radius: 22px;
    padding: 32px 26px;
    box-shadow: 0 15px 60px #0009;
}

.logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    color: #54e68b;
    font-size: 27px;
    margin-bottom: 10px;
}

.subtitle {
    color: #a5b8ac;
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.demo-warning {
    background: #282719;
    border: 1px solid #81743c;
    color: #f3df8c;
    padding: 12px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 22px;
    text-align: center;
}

label {
    display: block;
    color: #d8e7dc;
    font-size: 13px;
    margin: 16px 0 8px;
}

input, select {
    width: 100%;
    padding: 14px;
    background: #09120d;
    color: white;
    border: 1px solid #315a41;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

input:focus, select:focus {
    border-color: #54e68b;
}

button {
    width: 100%;
    border: none;
    border-radius: 11px;
    padding: 15px;
    margin-top: 23px;
    background: linear-gradient(135deg, #36d878, #15964d);
    color: #06170c;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

#status {
    display: none;
    text-align: center;
    margin-top: 22px;
}

.loader {
    width: 48px;
    height: 48px;
    border: 4px solid #284c36;
    border-top-color: #54e68b;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 18px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.progress {
    height: 9px;
    background: #26372c;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 18px;
}

.bar {
    height: 100%;
    width: 0%;
    background: #54e68b;
    transition: width .2s;
}

#result {
    display: none;
    text-align: center;
    margin-top: 24px;
    line-height: 1.7;
}

.success {
    font-size: 48px;
    margin-bottom: 12px;
}

.footer {
    text-align: center;
    color: #71877a;
    font-size: 11px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">💚</div>
    <h1>ROBUX DEMO CENTER</h1>

    <p class="subtitle">
        Eğlence amaçlı Robux demo deneyimi.
    </p>

    <div class="demo-warning">
        ⚠️ Bu resmi Roblox sitesi değildir. Gerçek Robux vermez
        veya aktarmayız. Roblox şifreni kesinlikle girme.
    </div>

    <form id="demoForm">

        <label for="username">Roblox kullanıcı adın</label>
        <input
            id="username"
            type="text"
            maxlength="30"
            placeholder="Kullanıcı adını yaz"
            required
        >

        <label for="amount">Demo Robux miktarı</label>
        <select id="amount" required>
            <option value="1000">1.000 Demo Robux</option>
            <option value="100000">100.000 Demo Robux</option>
            <option value="1000000">1.000.000 Demo Robux</option>
            <option value="100000000">100.000.000 Demo Robux</option>
            <option value="650000000000000">650T Demo Robux</option>
        </select>

        <button id="submitBtn" type="submit">
            DEMO İŞLEMİNİ BAŞLAT
        </button>
    </form>

    <div id="status">
        <div class="loader"></div>
        <h3>Demo işlemi hazırlanıyor...</h3>
        <p id="percent" style="color:#a5b8ac;margin-top:10px">
            %0
        </p>
        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>
    </div>

    <div id="result"></div>

    <div class="footer">
        ROBUX DEMO CENTER · Bağımsız eğlence projesi
    </div>

</div>

<script>
const WORKER_URL = "WORKER_ADRESINI_BURAYA_YAZ";

const form = document.getElementById("demoForm");
const button = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const amount = document.getElementById("amount").value;

    if (!username) {
        alert("Kullanıcı adını yazmalısın.");
        return;
    }

    if (WORKER_URL === "WORKER_ADRESINI_BURAYA_YAZ") {
        alert("Önce Cloudflare Worker adresini eklemeliyiz.");
        return;
    }

    button.disabled = true;
    form.style.display = "none";
    statusBox.style.display = "block";

    let progress = 0;

    const timer = setInterval(() => {
        progress = Math.min(progress + 2, 95);
        bar.style.width = progress + "%";
        percent.textContent = "%" + progress;
    }, 250);

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                amount: amount
            })
        });

        const data = await response.json();

        clearInterval(timer);

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Gönderim başarısız.");
        }

        bar.style.width = "100%";
        percent.textContent = "%100";

        setTimeout(() => {
            statusBox.style.display = "none";
            resultBox.style.display = "block";

            resultBox.innerHTML = `
                <div class="success">✅</div>
                <h2 style="color:#54e68b">Demo gönderimi tamamlandı!</h2>
                <p style="color:#b6c8bb;margin-top:10px">
                    Kullanıcı adı: ${escapeHTML(username)}<br>
                    Demo miktarı: ${Number(amount).toLocaleString("en-US")}
                </p>
                <p style="color:#82988a;font-size:12px;margin-top:14px">
                    Bilgiler e-posta bildirimi için gönderildi.
                    Gerçek Robux aktarılmamıştır.
                </p>
                <button onclick="location.reload()">YENİDEN DENE</button>
            `;
        }, 500);

    } catch (error) {
        clearInterval(timer);
        statusBox.style.display = "none";
        form.style.display = "block";
        button.disabled = false;
        alert("Gönderim hatası: " + error.message);
    }
});

function escapeHTML(value) {
    return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}
</script>

</body>
</html>
